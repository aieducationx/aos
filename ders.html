    try { return iki() ? API.Commit('') : API.LMSCommit(''); }
    catch (e) { return 'false'; }
  }

  // ------------------------------------------------------------- sıkıştırma
  // progress nesnesi -> kısa metin (adım bitleri onaltılık + sınav puanları)
  function paketle(progress, dersIdleri, bolumNolari) {
    var bit = '';
    dersIdleri.forEach(function (id) {
      var p = progress[id] || {};
      ADIMLAR.forEach(function (a) { bit += p[a] ? '1' : '0'; });
    });
    var hex = '';
    for (var i = 0; i < bit.length; i += 4) {
      hex += parseInt((bit.substr(i, 4) + '0000').slice(0, 4), 2).toString(16);
    }
    var puan = bolumNolari.map(function (n) {
      var e = progress['exam' + n];
      return (e && e.passed ? Math.max(0, Math.min(15, e.score | 0)) : 0).toString(16);
    }).join('');
    return (hex + '-' + puan).toUpperCase();
  }

  function ac(metin, dersIdleri, bolumNolari) {
    var progress = {};
    if (!metin || metin.indexOf('-') < 0) return progress;
    var p = metin.toLowerCase().split('-'), hex = p[0], puan = p[1] || '';
    var bit = '';
    for (var i = 0; i < hex.length; i++) {
      bit += ('0000' + parseInt(hex[i], 16).toString(2)).slice(-4);
    }
    dersIdleri.forEach(function (id, di) {
      var o = null;
      ADIMLAR.forEach(function (a, ai) {
        if (bit[di * 5 + ai] === '1') { o = o || {}; o[a] = true; }
      });
      if (o) progress[id] = o;
    });
    bolumNolari.forEach(function (n, i) {

      if (!oku('cmi.core.student_id') && !oku('cmi.learner_id')) {
        return { ok: false, hata: 'SCORM oturumu başlatılamadı' };
      }
    }
    baglandi = true;
    var no = oku(iki() ? 'cmi.learner_id' : 'cmi.core.student_id') || '';
    var ad = oku(iki() ? 'cmi.learner_name' : 'cmi.core.student_name') || '';
    // Canvas "Soyad, Ad" biçiminde verir; düzeltelim.
    if (ad.indexOf(',') > 0) {
      var pr = ad.split(',');
      ad = (pr[1] || '').trim() + ' ' + (pr[0] || '').trim();
    }
    var durum = oku(iki() ? 'cmi.completion_status' : 'cmi.core.lesson_status') || '';
    if (!iki() && (durum === 'not attempted' || durum === '' || durum === 'unknown')) {
      ayarla('cmi.core.lesson_status', 'incomplete');
    }
    return {
      ok: true, no: String(no), ad: ad.trim(),
      suspend: oku(iki() ? 'cmi.suspend_data' : 'cmi.suspend_data') || '',
    };
  }

  function kaydet(paket, yuzde, bitti) {
    if (!baglandi) return false;
    ayarla('cmi.suspend_data', paket);
    if (iki()) {
      ayarla('cmi.score.raw', yuzde);
      ayarla('cmi.score.min', 0); ayarla('cmi.score.max', 100);
      ayarla('cmi.score.scaled', (yuzde / 100).toFixed(4));
      ayarla('cmi.completion_status', bitti ? 'completed' : 'incomplete');
      ayarla('cmi.success_status', bitti ? 'passed' : 'unknown');
    } else {
      ayarla('cmi.core.score.raw', yuzde);
      ayarla('cmi.core.score.min', 0); ayarla('cmi.core.score.max', 100);
      ayarla('cmi.core.lesson_status', bitti ? 'completed' : 'incomplete');
    }
    isle();
    return true;
  }

  function kapat() {
    if (!baglandi) return;
    try { isle(); iki() ? API.Terminate('') : API.LMSFinish(''); } catch (e) {}
    baglandi = false;
  }

  g.addEventListener('beforeunload', kapat);
  g.addEventListener('pagehide', kapat);

  g.BTTScorm = {
    varMi: function () { return !!bul(); },
    baglan: baglan, kaydet: kaydet, kapat: kapat,
    paketle: paketle, ac: ac, hata: function () { return sonHata; },
  };
})(window);
</script>

   Küçük şablon çalışma zamanı — Claude Design tuvalindeki bileşeni

   Desteklenen sözdizimi (app_body.html ile birebir aynı):

  }
  function buildKids(kids, scope, out) {

<script>
var LESSONS = window.LESSONS, SECTIONS = window.SECTIONS, AB_KOPRU = window.AB_KOPRU || {};
class Component extends DCLogic {
  KEY = 'xx10_mo_v1';

  state = {
    view: 'welcome', name: '', nameDraft: '',
    lid: null, seg: 0,
    progress: {},
    quiz: { answers: {}, checked: false },
    task: { value: '', loading: false, feedback: null, showExample: false },
    prod: { checks: {} },
    a11y: { scale: 1, contrast: false, focus: false },
    tts: 'idle', term: null, toast: '', glossaryQuery: '',
    exam: null, examSec: null,
    // --- giriş ve senkron ---
    no: '', pin: '', noDraft: '', pinDraft: '', onay: false,
    loginErr: '', busy: false, sync: 'kapali', syncAt: 0,
  };

  // ---------- yapılandırma ----------
  ayar() { return (typeof window !== 'undefined' && window.SBAY_AYAR) || {}; }
  cevrimici() { const a = this.ayar(); return !!(a.url && a.anon && a.ders) || (a.kip === 'kanit' && !!a.tuz); }
  oturumKey() { return 'sbay_oturum_v1'; }
  veriKey(no) { return 'sbay_mo_v1:' + (this.ayar().ders || 'yerel') + ':' + (no || 'konuk'); }

  async rpc(fn, body) {
    const a = this.ayar();
    const r = await fetch(a.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: a.anon, Authorization: 'Bearer ' + a.anon, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  }

  // progress -> sunucu biçimi
  ayirProgress(progress) {
    const ilerleme = {}, sinavlar = {};
    Object.keys(progress || {}).forEach(k => {
      const m = /^exam(\d+)$/.exec(k);
      if (m) sinavlar['s' + m[1]] = progress[k];
      else ilerleme[k] = progress[k];
    });
    return { ilerleme, sinavlar };
  }
  birlestir(ilerleme, sinavlar) {
    const p = Object.assign({}, ilerleme || {});
    Object.keys(sinavlar || {}).forEach(k => {
      const m = /^s(\d+)$/.exec(k);
      if (m) p['exam' + m[1]] = sinavlar[k];
    });
    return p;
  }
  muhurSayisi(progress) {
    return SECTIONS.filter(x => progress['exam' + x.num] && progress['exam' + x.num].passed).length;
  }

  // ---------- kurulum ----------
  componentDidMount() {
    window.addEventListener('message', (e) => { const d = e.data || {}; if (d.tip === 'xx10-anim-bitti' && d.id && this.state.lid === d.id && !this.prog(d.id).video) this.setStep('video', true); });
    if (this.scormBaslat()) return;
    let oturum = null;
    try { oturum = JSON.parse(localStorage.getItem(this.oturumKey()) || 'null'); } catch (e) {}
    if (!this.cevrimici()) {
      // Sunucu yapılandırılmamış: yalnızca bu cihazda çalışır.
      this.yukleYerel('konuk');
      this.setState({ no: 'konuk', view: this.state.name || this.doneCount() ? 'map' : 'welcome', sync: 'kapali' });
      return;
    }
    if (this.kanitKipi()) {
      if (oturum && oturum.no && oturum.ders === this.ayar().ders) {
        this.yukleYerel(oturum.no);
        this.setState({ no: oturum.no, onay: true, view: 'map', sync: 'kapali' });
      }
      return;
    }
    if (oturum && oturum.no && oturum.pin && oturum.ders === this.ayar().ders) {
      this.yukleYerel(oturum.no);
      this.setState({ no: oturum.no, pin: oturum.pin, onay: true, view: 'map', sync: 'bekliyor' });
      this.cek(oturum.no, oturum.pin, true);
    }
  }

  yukleYerel(no) {
    try {
      const raw = localStorage.getItem(this.veriKey(no));
      if (!raw) { this.setState({ progress: {}, name: '' }); return; }
      const s = JSON.parse(raw);
      this.setState({
        name: s.name || '', progress: s.progress || {},
        a11y: Object.assign({ scale: 1, contrast: false, focus: false }, s.a11y || {}),
      });
    } catch (e) {}
  }

  componentWillUnmount() { try { window.speechSynthesis.cancel(); } catch (e) {} }

  persist(patch) {
    const next = {
      name: patch.name !== undefined ? patch.name : this.state.name,
      progress: patch.progress !== undefined ? patch.progress : this.state.progress,
      a11y: patch.a11y !== undefined ? patch.a11y : this.state.a11y,
    };
    try { localStorage.setItem(this.veriKey(this.state.no), JSON.stringify(next)); } catch (e) {}
    if (patch.progress !== undefined) {
      if (this.scormKipi()) { clearTimeout(this._st); this._st = setTimeout(() => this.scormKaydet(), 700); }
      else this.gonderSonra();
    }
  }

  // ---------- kanıt kipi (sunucusuz doğrulama) ----------
  kanitKipi() { const a = this.ayar(); return a.kip === 'kanit' && !!a.tuz && !this.scormKipi(); }
  scormKipi() { return !!this._scorm; }
  bolumNolari() { return SECTIONS.map(x => x.num); }

  scormBaslat() {
    if (!window.BTTScorm || !window.BTTScorm.varMi()) return false;
    const r = window.BTTScorm.baglan();
    if (!r.ok) return false;
    this._scorm = r;
    const ids = this.allLessonIds();
    const progress = window.BTTScorm.ac(r.suspend, ids, this.bolumNolari());
    // Aynı tarayıcıda daha ileri bir yerel kayıt varsa onu da kat.
    let yerel = {};
    try { yerel = JSON.parse(localStorage.getItem(this.veriKey(r.no)) || '{}').progress || {}; } catch (e) {}
    const bir = Object.assign({}, progress);
    Object.keys(yerel).forEach(k => { bir[k] = Object.assign({}, progress[k] || {}, yerel[k] || {}); });
    this.setState({
      no: r.no || 'scorm', name: r.ad || '', progress: bir,
      view: 'map', sync: 'tamam', onay: true,
    });
    return true;
  }

  scormKaydet() {
    if (!this._scorm) return;
    const ids = this.allLessonIds();
    const paket = window.BTTScorm.paketle(this.state.progress || {}, ids, this.bolumNolari());
    const yuzde = Math.round(this.doneCount() / ids.length * 100);
    const bitti = this.doneCount() === ids.length &&
                  this.muhurSayisi(this.state.progress || {}) === SECTIONS.length;
    this.setState({ sync: 'bekliyor' });
    const ok = window.BTTScorm.kaydet(paket, yuzde, bitti);
    this.setState({ sync: ok ? 'tamam' : 'hata', syncAt: Date.now() });
  }


  kanitKodu() {
    if (!window.BTTKanit) return '';
    const ids = this.allLessonIds();
    const no = (this.state.no && this.state.no !== 'konuk') ? this.state.no : (this.state.noDraft || '');
    if (!no) return '';
    return window.BTTKanit.kodUret({
      no: no,
      dersler: ids.map(i => this.lessonDone(i)),
      sinavlar: SECTIONS.map(x => {
        const e = this.state.progress['exam' + x.num];
        return e && e.passed ? (e.score | 0) : 0;
      }),
      tuz: this.ayar().tuz,
      ders: this.ayar().ders || '',
    });
  }

  kodKopyala = () => {
    const k = this.kanitKodu();
    if (!k) { this.showToast('Önce öğrenci numaranızla giriş yapın.'); return; }
    try {
      navigator.clipboard.writeText(k);
      this.showToast('Kod panoya kopyalandı.');
    } catch (e) {
      this.showToast('Kopyalanamadı; kodu elle seçip kopyalayın.');
    }
  };

  _indir(ad, icerik, tur) {
    try {
      const b = new Blob([icerik], { type: tur || 'text/plain;charset=utf-8' });
      const u = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = u; a.download = ad; document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(u); }, 400);
    } catch (e) { this.showToast('Dosya indirilemedi.'); }
  }

  karneIndir = () => {
    const kod = this.kanitKodu();
    if (!kod) { this.showToast('Önce öğrenci numaranızla giriş yapın.'); return; }
    const ids = this.allLessonIds();
    const satir = ids.map(i => {
      const l = this.lesson(i);
      return (this.lessonDone(i) ? 'TAMAM' : '—') + '\t' + i + '\t' + (l ? l.title : '');
    }).join('\n');
    const sinav = SECTIONS.map(x => {
      const e = this.state.progress['exam' + x.num];
      return x.num + '. bölüm (' + x.title + '): ' + (e && e.passed ? e.score + '/10 — geçti' : 'geçilmedi');
    }).join('\n');
    const metin = [
      'BİLİM, TEKNOLOJİ VE TOPLUM — TAMAMLAMA KARNESİ',
      'Ders kodu: ' + (this.ayar().ders || ''),
      'Öğrenci numarası: ' + this.state.no,
      (this.state.name ? 'Ad: ' + this.state.name : ''),
      'Tarih: ' + new Date().toLocaleDateString('tr-TR'),
      '', 'TAMAMLAMA KODU', kod, '',
      'DERSLER (' + this.doneCount() + '/' + ids.length + ')', satir, '',
      'BÖLÜM SINAVLARI', sinav, '',
      'Bu karne öğrencinin kendi tarayıcısında üretilmiştir. Yukarıdaki kod,',
      'dersin doğrulama sayfasında sınanarak içeriğinin değiştirilmediği teyit edilir.',
    ].filter(x => x !== null).join('\n');
    this._indir('SBAY_Karne_' + this.state.no + '.txt', metin);
  };

  yedekAl = () => {
    const y = {
      surum: 1, ders: this.ayar().ders || '', no: this.state.no || '',
      name: this.state.name || '', progress: this.state.progress || {},
      tarih: new Date().toISOString(),
    };
    this._indir('SBAY_Yedek_' + (this.state.no || 'konuk') + '.json',
                JSON.stringify(y, null, 2), 'application/json');
    this.showToast('Yedek dosyası indirildi.');
  };

  yedekYukleAc = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const y = JSON.parse(r.result);
          if (!y || typeof y.progress !== 'object') throw new Error('biçim');
          const bir = Object.assign({}, y.progress, this.state.progress || {});
          Object.keys(y.progress).forEach(k => {
            bir[k] = Object.assign({}, y.progress[k], (this.state.progress || {})[k] || {});
          });
          this.setState({ progress: bir, name: this.state.name || y.name || '' });
          this.persist({ progress: bir, name: this.state.name || y.name || '' });
          this.showToast('Yedek geri yüklendi.');
        } catch (e) { this.showToast('Dosya okunamadı; doğru yedek dosyasını seçtiğinizden emin olun.'); }
      };
      r.readAsText(f);
    };
    inp.click();
  };

  // ---------- sunucuyla eşitleme ----------
  gonderSonra() {
    if (this.kanitKipi() || this.scormKipi()) return;
    if (!this.cevrimici() || !this.state.no || this.state.no === 'konuk') return;
    clearTimeout(this._st);
    this.setState({ sync: 'bekliyor' });
    this._st = setTimeout(() => this.gonder(), 1200);
  }

  async gonder() {
    if (this.kanitKipi() || this.scormKipi()) return;
    if (!this.cevrimici() || !this.state.no || this.state.no === 'konuk') return;
    const progress = this.state.progress || {};
    const { ilerleme, sinavlar } = this.ayirProgress(progress);
    try {
      const r = await this.rpc('kaydet', {
        p_ders: this.ayar().ders, p_no: this.state.no, p_pin: this.state.pin,
        p_ilerleme: ilerleme, p_sinavlar: sinavlar,
        p_tamamlanan: this.doneCount(), p_muhur: this.muhurSayisi(progress),
      });
      if (r && r.ok) this.setState({ sync: 'tamam', syncAt: Date.now() });
      else this.setState({ sync: 'hata' });
    } catch (e) {
      this.setState({ sync: 'hata' });
      clearTimeout(this._rt);
      this._rt = setTimeout(() => this.gonder(), 20000);
    }
  }

  async cek(no, pin, sessiz) {
    try {
      const r = await this.rpc('getir', { p_ders: this.ayar().ders, p_no: no, p_pin: pin });
      if (!r || !r.ok) return r;
      if (!r.yeni) {
        const uzak = this.birlestir(r.ilerleme, r.sinavlar);
        const yerel = this.state.progress || {};
        // Daha ileri olanı al; adım adım birleştir.
        const bir = Object.assign({}, uzak);
        Object.keys(yerel).forEach(k => {
          bir[k] = Object.assign({}, uzak[k] || {}, yerel[k] || {});
        });
        this.setState({ progress: bir, sync: 'tamam', syncAt: Date.now() });
        try { localStorage.setItem(this.veriKey(no), JSON.stringify({ name: this.state.name, progress: bir, a11y: this.state.a11y })); } catch (e) {}
        if (JSON.stringify(bir) !== JSON.stringify(uzak)) this.gonderSonra();
      } else {
        this.setState({ sync: 'tamam', syncAt: Date.now() });
        this.gonderSonra();
      }
      return r;
    } catch (e) {
      if (!sessiz) this.showToast('Sunucuya ulaşılamadı; çalışmanız bu cihazda saklanıyor.');
      this.setState({ sync: 'hata' });
      return { ok: false, hata: 'ag' };
    }
  }

  showToast(t) { this.setState({ toast: t }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: '' }), 2600); }

  // ---------- veri yardımcıları ----------
  allLessonIds() { return SECTIONS.reduce((a, s) => a.concat(s.lessons), []); }
  lesson(id) { return LESSONS[id]; }
  secOf(id) { return SECTIONS.find(s => s.lessons.indexOf(id) >= 0); }
  hue(s) { return s ? s.hue : 42; }
  fg(s) { const h = this.hue(s); return s && s.cool ? 'oklch(0.44 0.07 ' + h + ')' : 'oklch(0.52 0.14 ' + h + ')'; }
  ring(s) { const h = this.hue(s); return s && s.cool ? 'oklch(0.76 0.05 ' + h + ')' : 'oklch(0.76 0.09 ' + h + ')'; }
  ring2(s) { const h = this.hue(s); return s && s.cool ? 'oklch(0.85 0.03 ' + h + ')' : 'oklch(0.85 0.05 ' + h + ')'; }
  bg(s) { const h = this.hue(s); return s && s.cool ? 'oklch(0.955 0.014 ' + h + ')' : 'oklch(0.955 0.022 ' + h + ')'; }

  prog(id) { return this.state.progress[id] || {}; }
  stepDone(id, k) { return !!this.prog(id)[k]; }
  lessonDone(id) { const p = this.prog(id); return !!(p.read && p.video && p.quiz && p.task && p.produce); }
  // Dersler düz sırayla açılır.
  bttIds() { return this.allLessonIds(); }
  acanDers(id) { return AB_KOPRU[id] || null; }

  unlocked(id) {
    const acan = this.acanDers(id);
    if (acan) return this.lessonDone(acan);          // AB modülü
    const ids = this.bttIds(); const i = ids.indexOf(id);
    if (i <= 0) return true;
    return true;              // dersler serbest sırayla açılır
  }

  kilitEtiketi(id) {
    const acan = this.acanDers(id);
    const kaynak = acan || (() => {
      const ids = this.bttIds(); const i = ids.indexOf(id);
      return i > 0 ? ids[i - 1] : null;
    })();
    const k = kaynak && LESSONS[kaynak];
    return k ? (k.num + ' ile açılır') : 'kilitli';
  }

  kilitNotu(id) {
    const acan = this.acanDers(id);
    if (acan) {
      const a = LESSONS[acan];
      return a ? (a.num + ' tamamlanınca açılır') : 'Bağlı ders tamamlanınca açılır';
    }
    const ids = this.bttIds(); const i = ids.indexOf(id);
    if (i <= 0) return '';
    const o = LESSONS[ids[i - 1]];
    return o ? (o.num + ' tamamlanınca açılır') : 'Önceki ders tamamlanınca açılır';
  }

  // ---------- video ----------
  videoKaynak(id) {
    const V = (typeof window !== 'undefined' && window.SBAY_VIDEO) || null;
    const A = (typeof window !== 'undefined' && window.XXA_ANIM) || null;
    if (A && A.dersler && A.dersler[id]) return { tur: 'anim', url: (A.klasor || '') + A.dersler[id] };
    if (!V || !V.dersler) return null;
    const v = V.dersler[id];
    if (!v || !String(v).trim()) return null;
    const t = String(v).trim();
    const yt = /(?:youtube\.com\/(?:watch\?v=|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/.exec(t);
    if (yt) return { tur: 'youtube', url: 'https://www.youtube-nocookie.com/embed/' + yt[1] + '?rel=0' };
    if (/^https?:\/\//i.test(t)) return { tur: 'yerel', url: t };
    return { tur: 'yerel', url: (V.klasor || '') + t };
  }
  setStep(k, v) {
    const id = this.state.lid; if (!id) return;
    const progress = Object.assign({}, this.state.progress);
    progress[id] = Object.assign({}, progress[id]); progress[id][k] = v;
    this.setState({ progress }); this.persist({ progress });
  }
  doneCount() { return this.allLessonIds().filter(i => this.lessonDone(i)).length; }

  // ---------- gezinme ----------
  goWelcome = () => this.setState({ view: 'welcome' });
  goMap = () => { try { window.speechSynthesis.cancel(); } catch (e) {} this.setState({ view: 'map', tts: 'idle' }); window.scrollTo(0, 0); };
  onName = (e) => this.setState({ nameDraft: e.target.value });
  onNameKey = (e) => { if (e.key === 'Enter') this.start(); };
  onNo = (e) => this.setState({ noDraft: e.target.value.toUpperCase(), loginErr: '' });
  onPin = (e) => this.setState({ pinDraft: e.target.value.replace(/[^0-9]/g, '').slice(0, 8), loginErr: '' });
  onLoginKey = (e) => { if (e.key === 'Enter') this.start(); };
  toggleOnay = () => this.setState({ onay: !this.state.onay, loginErr: '' });
  openAydinlatma = () => this.setState({ view: 'aydinlatma' });

  start = () => {
    const n = (this.state.nameDraft || this.state.name || '').trim();
    if (!this.cevrimici()) {
      this.setState({ name: n, no: 'konuk', view: 'map' });
      this.persist({ name: n }); window.scrollTo(0, 0);
      return;
    }
    const no = (this.state.noDraft || '').trim().toUpperCase();
    const pin = (this.state.pinDraft || '').trim();
    if (!/^[A-Z0-9._-]{3,24}$/.test(no)) {
      this.setState({ loginErr: 'Öğrenci numarasını yazın (3–24 karakter; harf, rakam, nokta veya tire).' }); return;
    }
    if (this.kanitKipi()) {
      if (!this.state.onay) {
        this.setState({ loginErr: 'Devam etmek için aydınlatma metnini okuduğunuzu onaylayın.' }); return;
      }
      this.yukleYerel(no);
      this.setState({ no, pin: '', name: n, view: 'map', busy: false });
      try { localStorage.setItem(this.oturumKey(), JSON.stringify({ ders: this.ayar().ders, no, pin: '' })); } catch (e) {}
      this.persist({ name: n });
      window.scrollTo(0, 0);
      return;
    }
    if (!/^[0-9]{4,8}$/.test(pin)) {
      this.setState({ loginErr: 'PIN 4 ile 8 arası rakamdan oluşmalı. İlk girişte belirlediğiniz PIN sonraki girişlerde de sorulur.' }); return;
    }
    if (!this.state.onay) {
      this.setState({ loginErr: 'Devam etmek için aydınlatma metnini okuduğunuzu onaylayın.' }); return;
    }
    this.setState({ busy: true, loginErr: '' });
    this.yukleYerel(no);
    this.setState({ no, pin, name: n });
    this.cek(no, pin, true).then((r) => {
      if (r && r.ok === false) {
        const h = r.hata || '';
        const mesaj = h === 'pin_yanlis'
          ? 'Bu numara için farklı bir PIN kayıtlı. PIN\'inizi hatırlamıyorsanız dersin öğretim elemanına yazın.'
          : h === 'ders_yok' ? 'Ders kodu tanınmadı; bağlantıyı öğretim elemanından teyit edin.'
          : h === 'ag' ? '' : 'Giriş yapılamadı.';
        if (mesaj) { this.setState({ busy: false, loginErr: mesaj, no: '', pin: '' }); return; }
      }
      try { localStorage.setItem(this.oturumKey(), JSON.stringify({ ders: this.ayar().ders, no, pin })); } catch (e) {}
      this.setState({ busy: false, view: 'map' });
      this.persist({ name: n });
      window.scrollTo(0, 0);
    });
  };

  cikis = () => {
    clearTimeout(this._st);
    try { localStorage.removeItem(this.oturumKey()); } catch (e) {}
    this.setState({
      no: '', pin: '', noDraft: '', pinDraft: '', onay: false, name: '', nameDraft: '',
      progress: {}, view: 'welcome', sync: 'kapali', loginErr: '',
    });
    window.scrollTo(0, 0);
  };
  openLesson = (id) => {
    if (!this.unlocked(id)) { this.showToast(this.kilitNotu(id) || 'Bu ders henüz açılmadı.'); return; }
    const p = this.prog(id);
    this.setState({
      view: 'lesson', lid: id, seg: 0,
      quiz: { answers: {}, checked: false },
      task: { value: p.taskText || '', loading: false, feedback: null, showExample: false },
      prod: { checks: {} }, tts: 'idle',
    });
    window.scrollTo(0, 0);
  };
  openGlossary = () => this.setState({ view: 'glossary', glossaryQuery: '' });
  openCert = () => this.setState({ view: 'cert' });
  closeTerm = () => this.setState({ term: null });

  // ---------- erişilebilirlik ----------
  cycleScale = () => { const a = Object.assign({}, this.state.a11y); a.scale = a.scale >= 1.3 ? 1 : Math.round((a.scale + 0.15) * 100) / 100; this.setState({ a11y: a }); this.persist({ a11y: a }); };
  toggleContrast = () => { const a = Object.assign({}, this.state.a11y); a.contrast = !a.contrast; this.setState({ a11y: a }); this.persist({ a11y: a }); };
  toggleFocus = () => { const a = Object.assign({}, this.state.a11y); a.focus = !a.focus; this.setState({ a11y: a }); this.persist({ a11y: a }); };
  toggleTts = () => {
    try {
      const S = window.speechSynthesis;
      if (this.state.tts === 'playing') { S.cancel(); this.setState({ tts: 'idle' }); return; }
      const les = this.lesson(this.state.lid); if (!les) return;
      const seg = les.segments[this.state.seg];
      const text = seg.heading + '. ' + seg.blocks.map(b =>
        b.t === 'p' ? b.v : b.t === 'callout' ? (b.title + '. ' + b.body) :
        b.t === 'list' ? b.items.join('. ') : b.t === 'figure' ? (b.caption + '. ' + b.note) : (b.caption || '')
      ).join(' ');
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'tr-TR'; u.rate = 0.98;
      u.onend = () => this.setState({ tts: 'idle' });
      S.cancel(); S.speak(u); this.setState({ tts: 'playing' });
    } catch (e) { this.showToast('Sesli okuma bu tarayıcıda kullanılamıyor.'); }
  };

  // ---------- Oku ----------
  goSeg = (i) => { try { window.speechSynthesis.cancel(); } catch (e) {} this.setState({ seg: i, tts: 'idle' }); };
  prevSeg = () => { if (this.state.seg > 0) this.goSeg(this.state.seg - 1); };
  nextSeg = () => {
    const les = this.lesson(this.state.lid); if (!les) return;
    if (this.state.seg < les.segments.length - 1) this.goSeg(this.state.seg + 1);
    else { this.setStep('read', true); this.showToast('Okuma adımı tamamlandı.'); }
  };
  markVideo = () => { this.setStep('video', true); this.showToast('İzleme adımı işaretlendi.'); };

  // ---------- Sorular ----------
  pickAnswer = (qi, val) => {
    if (this.state.quiz.checked) return;
    const answers = Object.assign({}, this.state.quiz.answers); answers[qi] = val;
    this.setState({ quiz: { answers, checked: false } });
  };
  onFill = (qi, e) => {
    if (this.state.quiz.checked) return;
    const answers = Object.assign({}, this.state.quiz.answers); answers[qi] = e.target.value;
    this.setState({ quiz: { answers, checked: false } });
  };
  norm(s) { return String(s || '').toLocaleLowerCase('tr').replace(/[^\wçğıöşü]/g, '').trim(); }
  isCorrect(q, a) {
    if (a === undefined) return false;
    if (q.type === 'mc') return a === q.correct;
    if (q.type === 'tf') return a === q.correct;
    const fold = (z) => this.norm(z).replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g').replace(/ç/g, 'c').replace(/ö/g, 'o').replace(/ü/g, 'u');
    const g = fold(a); if (!g) return false;
    return (q.answers || []).some(x => { const k = fold(x); return k === g || (k.length >= 4 && g.length >= 4 && (g.startsWith(k.slice(0, k.length - 2)) && Math.abs(g.length - k.length) <= 5)); });
  }
  checkQuiz = () => {
    const les = this.lesson(this.state.lid); if (!les) return;
    if (this.state.quiz.checked) { this.setState({ quiz: { answers: this.state.quiz.answers, checked: false } }); return; }
    const qs = les.questions; const ans = this.state.quiz.answers;
    const need = Math.max(3, Math.round(qs.length * 0.55));
    const correct = qs.filter((q, i) => this.isCorrect(q, ans[i])).length;
    this.setState({ quiz: { answers: ans, checked: true } });
    if (correct >= need) { this.setStep('quiz', true); this.showToast(correct + '/' + qs.length + ' doğru, adım tamamlandı.'); }
    else this.showToast(correct + '/' + qs.length + ' doğru. Geçmek için en az ' + need + ' doğru gerekir; ipuçlarına bakıp yanıtlarınızı düzeltin.');
  };

  // ---------- Görev ----------
  onTask = (e) => this.setState({ task: Object.assign({}, this.state.task, { value: e.target.value }) });
  toggleExample = () => this.setState({ task: Object.assign({}, this.state.task, { showExample: !this.state.task.showExample }) });
  submitTask = async () => {
    const les = this.lesson(this.state.lid); if (!les) return;
    const v = (this.state.task.value || '').trim();
    if (v.split(/\s+/).filter(Boolean).length < 40) { this.showToast('En az 40 kelimelik bir yanıt yazın.'); return; }
    const progress = Object.assign({}, this.state.progress);
    progress[this.state.lid] = Object.assign({}, progress[this.state.lid], { taskText: v });
    this.setState({ progress, task: Object.assign({}, this.state.task, { loading: true, feedback: null }) });
    this.persist({ progress });
    const prompt = 'Bir yetişkin eğitimi yüksek lisans dersinde ("Yetişkin Eğitiminde Akıllı ve Uyarlanabilir Öğrenme Sistemleri") öğrenci ödevini değerlendiriyorsun. Türkçe, yapıcı ve somut geri bildirim ver.\n\nDERS: ' + les.num + ' ' + les.title + '\nBÜYÜK SORU: ' + les.question + '\nGÖREV YÖNERGESİ: ' + les.task.prompt + '\n\nÖĞRENCİ YANITI:\n' + v + '\n\nDeğerlendirme ölçütleri: (1) dersin kavramlarını doğru kullanma, (2) bir vakaya somut uygulama, (3) kendi cümleleriyle düşünme, (4) anlatım. İlk satır tam olarak şu biçimde olsun: "Puan: X/100". Sonra en çok üç kısa paragrafta: güçlü yön, geliştirilecek yön, bir sonraki adım için somut öneri.';
    try {
      if (window.claude && typeof window.claude.complete === 'function') {
        const res = await window.claude.complete(prompt);
        this.setState({ task: Object.assign({}, this.state.task, { loading: false, feedback: res, value: v }) });
        this.setStep('task', true);
      } else {
        this.setState({ task: Object.assign({}, this.state.task, { loading: false, feedback: 'Yapay zekâ değerlendirmesi bu görünümde etkin değil. "Örnek cevabı gör" ile kendi yanıtınızı karşılaştırabilirsiniz; görev adımı tamamlandı sayıldı.', value: v }) });
        this.setStep('task', true);
      }
    } catch (e) {
      this.setState({ task: Object.assign({}, this.state.task, { loading: false, feedback: 'Geri bildirim alınamadı. Yanıtınız kaydedildi; görev adımı tamamlandı sayıldı.', value: v }) });
      this.setStep('task', true);
    }
  };

  // ---------- Üret ve paylaş ----------
  produceChecks(les) {
    const raw = les.produce.olcut || '';
    let parts = raw.split(/\(\d\)\s*/).map(s => s.replace(/;\s*$/, '').trim()).filter(Boolean);
    if (parts.length < 2) parts = raw.split(/;\s*/).map(s => s.trim()).filter(Boolean);
    return parts.slice(0, 6);
  }
  toggleCheck = (i) => {
    const checks = Object.assign({}, this.state.prod.checks); checks[i] = !checks[i];
    this.setState({ prod: { checks } });
  };
  markProduce = () => {
    const les = this.lesson(this.state.lid); if (!les) return;
    const n = this.produceChecks(les).length;
    const done = Object.keys(this.state.prod.checks).filter(k => this.state.prod.checks[k]).length;
    if (done < n) { this.showToast('Önce tüm kabul ölçütlerini işaretleyin (' + done + '/' + n + ').'); return; }
    this.setStep('produce', true); this.showToast('Materyal Padlet’e yüklendi olarak işaretlendi.');
  };

  finishLesson = () => {
    const id = this.state.lid;
    if (!this.lessonDone(id)) { this.showToast('Beş adımın tamamı bitmeden ders kapanmaz.'); return; }
    const ids = this.allLessonIds(); const i = ids.indexOf(id);
    if (i < ids.length - 1) this.openLesson(ids[i + 1]); else this.openCert();
  };

        box: 'width:17px;height:17px;flex:none;border:1px solid ' + (st.prod.checks[i] ? 'oklch(0.5 0.11 145)' : 'oklch(0.86 0.012 72)') +
          ';background:' + (st.prod.checks[i] ? 'oklch(0.965 0.018 145)' : 'oklch(0.995 0.004 78)') + ';color:oklch(0.45 0.1 145);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:2px',
      }));
      v.padletTemplate = (l.produce.padlet || '').split('·').map(s => '· ' + s.trim()).join('\n');
      v.markProduce = this.markProduce;
      v.prodBtn = p.produce ? 'Yüklendi ✓' : 'Padlet’e yükledim';
      v.prodStatus = p.produce ? 'Bu adım tamamlandı' : 'Tüm ölçütleri işaretleyip yükleyin';

      const btgt = l.bridge && LESSONS[l.bridge] ? LESSONS[l.bridge] : null;
      v.bridgeLabel = btgt ? 'Sonraki derse köprü' : 'Dönemin sonu';
      v.hasBridge = !!btgt;
      v.bridgeBtn = btgt ? (btgt.num + ' · ' + btgt.title) : '';
      v.openBridge = this.openBridge;

      v.finishLabel = this.lessonDone(st.lid) ? 'Sonraki ders →' : 'Beş adımı tamamlayın';
      v.finishStyle = this.lessonDone(st.lid) ? '' : 'opacity:0.45;cursor:not-allowed';
      v.finishLesson = this.finishLesson;
    }

    // sınav
    if (st.view === 'exam' && st.exam) {
      const ex = st.exam; const sec = SECTIONS.find(s => s.num === st.examSec);
      const letters2 = ['a', 'b', 'c', 'd', 'e'];
      v.exam = {
        title: 'Bölüm ' + sec.num + ' sınavı · ' + sec.kicker,
        sub: '10 soru · 7 doğru ile bölüm rozeti kazanılır. Sorular bölümün derslerinden rastgele seçilir.',
        btn: ex.checked ? 'Yol haritasına dön' : 'Sınavı bitir',
        retryVisible: ex.checked,
        result: ex.checked ? (ex.score + '/10 — ' + (ex.score >= 7 ? 'Geçtiniz, bölüm mührü kazanıldı.' : 'Geçemediniz; yeni sorularla tekrar deneyin.')) : '',
        resultColor: ex.checked ? (ex.score >= 7 ? 'oklch(0.45 0.1 145)' : 'oklch(0.5 0.13 28)') : 'oklch(0.56 0.018 60)',
        items: ex.qs.map((q, qi) => ({
          n: qi + 1, q: q.q, showExpl: ex.checked, expl: q.expl,
          explBg: ex.answers[qi] === q.correct ? 'oklch(0.968 0.014 145)' : 'oklch(0.968 0.014 28)',
        explFg: ex.answers[qi] === q.correct ? 'oklch(0.45 0.1 145)' : 'oklch(0.5 0.13 28)',
          options: q.options.map((t, oi) => {
            const sel = ex.answers[qi] === oi;
            const isRight = ex.checked && oi === q.correct;
            const isWrongSel = ex.checked && sel && !isRight;
            let border = 'oklch(0.9 0.011 72)', bgc = 'oklch(0.995 0.004 78)', col = 'oklch(0.36 0.018 60)';
            if (sel && !ex.checked) { border = 'oklch(0.52 0.14 42)'; bgc = 'oklch(0.965 0.022 78)'; col = 'oklch(0.24 0.018 60)'; }
            if (isRight) { border = 'oklch(0.5 0.11 145)'; bgc = 'oklch(0.965 0.018 145)'; col = 'oklch(0.24 0.018 60)'; }
            if (isWrongSel) { border = 'oklch(0.55 0.15 28)'; bgc = 'oklch(0.965 0.018 28)'; col = 'oklch(0.24 0.018 60)'; }
            return { text: t, letter: letters2[oi], pick: () => this.pickExam(qi, oi),
              style: 'display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:2px;border:1px solid ' + border + ';background:' + bgc + ';color:' + col + ';font-size:13.7px;line-height:1.55;width:100%',
              mark: 'width:19px;height:19px;flex:none;border:1px solid ' + border + ';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700' };
          }),
        })),
      };
      v.submitExam = this.submitExam; v.retryExam = this.retryExam;
    }

    // sözlükçe
    if (st.view === 'glossary') {
      const q = this.norm(st.glossaryQuery);
      const all = this.glossaryAll();
      v.glossaryCount = all.length;
      v.glossaryQuery = st.glossaryQuery;
      v.onGlossarySearch = this.onGlossarySearch;
      v.glossaryList = (q ? all.filter(g => this.norm(g.term).indexOf(q) >= 0 || this.norm(g.def).indexOf(q) >= 0) : all);
    }

    // karne
    if (st.view === 'cert') {
      const passedCount = SECTIONS.filter(s => st.progress['exam' + s.num] && st.progress['exam' + s.num].passed).length;
      v.certStats = [
        { v: done + '/' + ids.length, l: 'tamamlanan ders' },
        { v: passedCount + '/' + SECTIONS.length, l: 'kazanılan bölüm mührü' },
        { v: '%' + overallPct, l: 'genel ilerleme' },
      ];
      v.certRows = SECTIONS.map(s => {
        const dn = s.lessons.filter(i => this.lessonDone(i)).length;
        const e = st.progress['exam' + s.num];
        return {
          num: s.num, kicker: s.kicker, fg: this.fg(s), ring: this.ring(s), ring2: this.ring2(s),
          sealed: !!(e && e.passed), notSealed: !(e && e.passed), badge: dn + '',
          detail: dn + '/' + s.lessons.length + ' ders' + (e ? ' · sınav ' + e.score + '/10' : ''),
          status: e && e.passed ? 'Mühürlendi' : (dn === s.lessons.length ? 'Sınav bekliyor' : 'Sürüyor'),
        };
      });
      const full = passedCount === SECTIONS.length;
      v.certBg = full ? 'oklch(0.21 0.02 55)' : 'oklch(0.955 0.016 78)';
      v.certFg = full ? 'oklch(0.82 0.1 78)' : 'oklch(0.42 0.06 78)';
      v.certSub = full ? 'oklch(0.82 0.014 60)' : 'oklch(0.4 0.018 60)';
      v.certRule = full ? 'oklch(0.5 0.06 78)' : 'oklch(0.82 0.06 78)';
      v.certRule2 = full ? 'oklch(0.4 0.04 78)' : 'oklch(0.88 0.04 78)';
      v.certTitle = full ? 'Katılım belgesi açıldı' : 'Katılım belgesi henüz açılmadı';
      v.certText = full
        ? (st.name ? st.name + ', ' : '') + 'yirmi dört dersin tamamını bitirdiniz; dört bölüm sınavının tamamını geçtiniz. Bu belgeyi dersin öğretim elemanına iletebilirsiniz.'
        : 'Altı bölümün sınavı da geçildiğinde katılım belgeniz burada açılır.';
    }

    // ---------- aydınlatma metni ----------
    if (st.view === 'aydinlatma') {
      const eposta = this.ayar().eposta || '[kurumsal e-posta adresi]';
      v.kvkkBolumler = [
        { baslik: 'Veri sorumlusu', metin: 'Bu platform, Anadolu Üniversitesi Yaşam Boyu Öğrenme ve Yetişkin Eğitimi yüksek lisans programında yürütülen "Yetişkin Eğitiminde Akıllı ve Uyarlanabilir Öğrenme Sistemleri" dersinin bir öğretim aracıdır. Veri işleme faaliyeti, dersin yürütücüsü Prof. Dr. Hıdır Karaduman tarafından, yalnızca dersin yürütülmesi amacıyla gerçekleştirilir. İletişim: ' + eposta },
        { baslik: 'İşlenen kişisel veriler', metin: 'Bu platform sizden ad, soyad, e-posta adresi, telefon numarası veya T.C. kimlik numarası istemez ve bunları hiçbir yerde saklamaz. Sunucuda saklanan veriler yalnızca şunlardır:',
          liste: ['Ders kodu.', 'Öğrenci numaranız.', 'Kendi belirlediğiniz PIN\'in geri çevrilemez şifreli özeti — PIN\'in kendisi saklanmaz.', 'Hangi ders adımlarını tamamladığınız ve bölüm sınavlarından aldığınız puanlar.', 'İlk giriş ve son güncelleme tarih-saatleri.'] },
        { baslik: 'Numaranız ile adınız arasındaki bağ', metin: 'Öğrenci numaranızı adınıza bağlayan sınıf listesi yalnızca ders yürütücüsünün kendi bilgisayarında bulunur ve hiçbir sunucuya aktarılmaz. Giriş ekranında yazdığınız ad da yalnızca kullandığınız cihazın tarayıcısında kalır.' },
        { baslik: 'İşleme amacı', metin: 'Veriler yalnızca iki amaçla işlenir: ilerlemenizin kaydedilmesi ve başka bir cihazdan kaldığınız yerden devam edebilmeniz; ders yürütücüsünün sınıfın genel ilerlemesini izleyip dönem içi katılımı değerlendirebilmesi. Veriler reklam, profilleme veya ticari analiz için kullanılmaz, üçüncü kişilere satılmaz veya devredilmez.' },
        { baslik: 'Hukuki sebep ve alternatif', metin: 'İşleme, 6698 sayılı Kanun\'un 4. maddesindeki "işlendikleri amaçla bağlantılı, sınırlı ve ölçülü olma" ilkesine uygun biçimde, dersin yürütülmesi için gereken asgari veriyle sınırlı tutulmuştur. Platformu kullanmak istemeyen öğrenciler ders adımlarının çıktılarını basılı olarak teslim ederek dersi eksiksiz tamamlayabilir; bu tercih hiçbir biçimde dezavantaj oluşturmaz.' },
        { baslik: 'Verinin nerede tutulduğu', metin: 'Veriler, Supabase Inc. tarafından işletilen ve Almanya\'nın Frankfurt şehrinde bulunan, Avrupa Birliği Genel Veri Koruma Tüzüğü (GDPR) kapsamındaki bir veri merkezinde saklanır. Sunucuda ad, soyad veya e-posta bulunmadığı için buradaki veri tek başına hiçbir kişiyi doğrudan belirlemez.' },
        { baslik: 'Saklama süresi', metin: 'Veriler, dersin verildiği akademik dönemin sonuna ve notların kesinleşmesine kadar saklanır. Bu tarihten sonra sunucudaki tüm ders kayıtları silinir.' },
        { baslik: 'Haklarınız (KVKK md. 11)', metin: 'Kişisel verinizin işlenip işlenmediğini öğrenme, işlenmişse bilgi talep etme, işlenme amacını ve amaca uygun kullanılıp kullanılmadığını öğrenme, aktarıldığı üçüncü kişileri bilme, eksik veya yanlış işlenmişse düzeltilmesini isteme, silinmesini veya yok edilmesini isteme, bu işlemlerin üçüncü kişilere bildirilmesini isteme, münhasıran otomatik sistemlerle analiz sonucu aleyhinize bir sonuç doğmasına itiraz etme ve kanuna aykırı işleme nedeniyle zarara uğramanız hâlinde zararın giderilmesini talep etme haklarına sahipsiniz.' },
        { baslik: 'Başvuru yolu', metin: 'Haklarınızı kullanmak için ders yürütücüsüne ' + eposta + ' üzerinden yazılı olarak başvurabilirsiniz. Kaydınızın dönem bitmeden silinmesini isterseniz talebiniz aynı hafta içinde yerine getirilir ve bu durum ders başarınızı etkilemez. Anadolu Üniversitesi\'nin KVKK irtibat kişisine ve Kişisel Verileri Koruma Kurumu\'na başvurma hakkınız saklıdır.' },
        { baslik: 'PIN hakkında', metin: 'PIN\'i siz belirlersiniz ve sistemde geri çevrilemez biçimde saklanır. Unutmanız hâlinde ders yürütücüsü PIN\'i size söyleyemez, yalnızca kaydınızı sıfırlayabilir. PIN olarak doğum tarihinizi veya öğrenci numaranızın son hanelerini kullanmayınız.' },
      ];
    }

    return v;
  }
}

window.addEventListener('DOMContentLoaded', function () {
  var root = document.getElementById('uyg'); root.innerHTML = '';
  window.__mount(Component, document.getElementById('sablon').textContent, root);
});
</script>
<script type="text/template" id="sablon">

<div class="{{rootCls}}" style="min-height:100vh;background:oklch(0.968 0.011 78)">

<!-- ================= HOŞ GELDİNİZ ================= -->
<sc-if value="{{isWelcome}}" hint-placeholder-val="{{ true }}">
<div>
  <div style="background:oklch(0.21 0.02 55);position:relative;overflow:hidden">
    <div style="position:absolute;top:-180px;right:-140px;width:520px;height:520px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%, transparent 0 46px, oklch(0.72 0.09 78 / 0.13) 46px 47px);pointer-events:none"></div>
    <div style="max-width:1060px;margin:0 auto;padding:70px 34px 62px;position:relative">
      <div style="display:flex;align-items:center;gap:18px;margin-bottom:34px">
        <div style="position:relative;width:54px;height:54px;flex:none;display:flex;align-items:center;justify-content:center">
          <div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid oklch(0.74 0.1 78 / 0.75)"></div>
          <div style="position:absolute;inset:9px;border-radius:50%;border:1px solid oklch(0.74 0.1 78 / 0.42)"></div>
          <div style="width:11px;height:11px;background:oklch(0.62 0.16 42);transform:rotate(45deg)"></div>
        </div>
        <div>
          <div class="kick" style="color:oklch(0.78 0.09 78)">Anadolu Üniversitesi</div>
          <div style="font-size:12.5px;color:oklch(0.66 0.015 60);margin-top:3px">Yaşam Boyu Öğrenme ve Yetişkin Eğitimi · Yüksek lisans</div>
        </div>
      </div>
      <h1 style="font-size:60px;line-height:1.02;color:oklch(0.965 0.012 78);max-width:640px">Yetişkin Eğitiminde Akıllı ve Uyarlanabilir Öğrenme Sistemleri</h1>
      <div style="font-family:'Newsreader',serif;font-style:italic;font-size:25px;color:oklch(0.8 0.08 78);margin-top:20px">Hangi karar, kim tarafından, neye dayanarak?</div>
      <div style="width:64px;height:1px;background:oklch(0.5 0.05 78);margin:26px 0"></div>
      <div style="font-size:15.5px;line-height:1.72;color:oklch(0.74 0.014 60);max-width:560px">On iki hafta, yirmi dört ders. Her ders bir soruyla açılır, gerçek bir sistem ya da çalışmayla ilerler ve sizin yazdığınız bir parçayla kapanır. Dönem sonunda elinizde kendi uyarlanabilir destek tasarımınız, yani Tasarım Dosyanız olur.</div>
      <div style="margin-top:34px;max-width:560px">
        <sc-if value="{{online}}" hint-placeholder-val="{{ true }}">
        <div style="background:oklch(0.26 0.02 55);border:1px solid oklch(0.36 0.02 55);padding:24px 26px 22px">
          <div class="kick" style="color:oklch(0.78 0.09 78);margin-bottom:4px">Derse giriş · {{dersKodu}}</div>
          <sc-if value="{{pinGerekli}}" hint-placeholder-val="{{ true }}">
            <div style="font-size:13px;color:oklch(0.72 0.014 60);line-height:1.6;margin-bottom:18px">Adınız sunucuya gönderilmez. Yalnızca öğrenci numaranız ve ilerlemeniz kaydedilir; böylece başka bir cihazdan kaldığınız yerden devam edebilirsiniz.</div>
          </sc-if>
          <sc-if value="{{kanitGiris}}" hint-placeholder-val="{{ false }}">
            <div style="font-size:13px;color:oklch(0.72 0.014 60);line-height:1.6;margin-bottom:18px">Hiçbir veri sunucuya gönderilmez; çalışmanız yalnızca bu tarayıcıda saklanır. Numaranız, dersi bitirdiğinizde üreteceğiniz tamamlama kodunun içine yazılır.</div>
          </sc-if>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <input value="{{noDraft}}" onInput="{{onNo}}" onKeyDown="{{onLoginKey}}" placeholder="Öğrenci numaranız" style="flex:1;min-width:190px;background:oklch(0.22 0.02 55);border-color:oklch(0.4 0.02 55);color:oklch(0.95 0.01 78)">
            <sc-if value="{{pinGerekli}}" hint-placeholder-val="{{ true }}">
              <input value="{{pinDraft}}" onInput="{{onPin}}" onKeyDown="{{onLoginKey}}" placeholder="PIN (4-8 rakam)" style="width:150px;background:oklch(0.22 0.02 55);border-color:oklch(0.4 0.02 55);color:oklch(0.95 0.01 78)">
            </sc-if>
          </div>
          <input value="{{nameDraft}}" onInput="{{onName}}" onKeyDown="{{onLoginKey}}" placeholder="Adınız (isteğe bağlı, yalnızca bu cihazda kalır)" style="margin-top:10px;background:oklch(0.22 0.02 55);border-color:oklch(0.4 0.02 55);color:oklch(0.95 0.01 78)">
          <div onClick="{{toggleOnay}}" style="display:flex;gap:11px;align-items:flex-start;margin-top:16px;cursor:pointer">
            <div style="width:17px;height:17px;flex:none;margin-top:2px;border:1px solid oklch(0.6 0.05 78);display:flex;align-items:center;justify-content:center;background:oklch(0.22 0.02 55)">
              <sc-if value="{{onay}}" hint-placeholder-val="{{ true }}">
                <div style="width:8px;height:8px;background:oklch(0.72 0.14 42);transform:rotate(45deg)"></div>
              </sc-if>
            </div>
            <div style="font-size:12.8px;color:oklch(0.74 0.014 60);line-height:1.55">Aydınlatma metnini okudum. Bu platformun hangi verimi işlediğini biliyorum.</div>
          </div>
          <div style="display:flex;gap:12px;margin-top:18px;align-items:center;flex-wrap:wrap">
            <button onClick="{{start}}" class="btnp" style="background:oklch(0.62 0.16 42)">{{startLabel}}</button>
            <button onClick="{{openAydinlatma}}" style="font-size:12.5px;color:oklch(0.78 0.09 78);text-decoration:underline;text-underline-offset:3px">Bu platform hangi verimi işliyor?</button>
          </div>
          <sc-if value="{{hasLoginErr}}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:14px;padding:11px 14px;background:oklch(0.3 0.06 35);border-left:2px solid oklch(0.68 0.16 42);font-size:12.8px;color:oklch(0.92 0.02 60);line-height:1.55">{{loginErr}}</div>
          </sc-if>
        </div>
        </sc-if>
        <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <input value="{{nameDraft}}" onInput="{{onName}}" onKeyDown="{{onNameKey}}" placeholder="Adınız" style="width:240px;background:oklch(0.27 0.02 55);border-color:oklch(0.38 0.02 55);color:oklch(0.95 0.01 78)">
          <button onClick="{{start}}" class="btnp" style="background:oklch(0.62 0.16 42)">{{startLabel}}</button>
          <div style="font-size:12px;color:oklch(0.6 0.015 60)">Çalışmanız yalnızca bu cihazda saklanır.</div>
        </div>
        </sc-if>
      </div>
    </div>
  </div>

  <div style="max-width:1060px;margin:0 auto;padding:56px 34px 78px">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid oklch(0.88 0.012 70);border-bottom:1px solid oklch(0.88 0.012 70)">
      <sc-for list="{{welcomeStats}}" as="s" hint-placeholder-count="4">
        <div style="padding:24px 22px 24px 0;border-right:1px solid oklch(0.9 0.011 72)">
          <div style="font-family:'Newsreader',serif;font-size:38px;font-weight:600;color:oklch(0.52 0.14 42);line-height:1">{{s.v}}</div>
          <div style="font-size:12.8px;color:oklch(0.44 0.018 60);margin-top:9px;line-height:1.5">{{s.l}}</div>
        </div>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:54px;margin-top:52px">
      <div>
        <div class="kick" style="color:oklch(0.52 0.14 42);margin-bottom:14px">Nasıl işler</div>
        <div style="display:flex;flex-direction:column;gap:0">
          <sc-for list="{{howSteps}}" as="h" hint-placeholder-count="5">
            <div style="display:flex;gap:16px;align-items:flex-start;padding:15px 0;border-bottom:1px solid oklch(0.92 0.01 72)">
              <div style="font-family:'Newsreader',serif;font-size:17px;font-weight:600;color:oklch(0.7 0.1 78);min-width:20px;line-height:1.4">{{h.n}}</div>
              <div style="font-size:14.3px;line-height:1.65;color:oklch(0.33 0.016 60)">{{h.t}}</div>
            </div>
          </sc-for>
        </div>
      </div>
      <div>
        <div class="kick" style="color:oklch(0.52 0.14 42);margin-bottom:14px">Her dersin beş adımı</div>
        <div style="display:flex;flex-direction:column;gap:0">
          <sc-for list="{{stepCards}}" as="sc" hint-placeholder-count="5">
            <div style="display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid oklch(0.92 0.01 72)">
              <div style="position:relative;width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center">
                <div style="position:absolute;inset:0;border-radius:50%;border:1px solid oklch(0.78 0.08 78)"></div>
                <div style="width:7px;height:7px;background:oklch(0.62 0.16 42);transform:rotate(45deg)"></div>
              </div>
              <div>
                <div style="font-family:'Newsreader',serif;font-size:17.5px;font-weight:600">{{sc.name}}</div>
                <div style="font-size:12.6px;color:oklch(0.5 0.018 60);margin-top:2px">{{sc.desc}}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:16px;margin:52px 0 22px">
      <div style="height:1px;flex:1;background:oklch(0.88 0.012 70)"></div>
      <div style="width:9px;height:9px;background:oklch(0.74 0.1 78);transform:rotate(45deg)"></div>
      <div style="height:1px;flex:1;background:oklch(0.88 0.012 70)"></div>
    </div>

    <div class="kick" style="color:oklch(0.52 0.14 42);margin-bottom:16px;text-align:center">On iki hafta, dört bölüm</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px">

<div style="position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:oklch(0.21 0.02 55);color:oklch(0.95 0.012 78);padding:13px 24px;font-size:13.2px;z-index:70;letter-spacing:0.02em">{{toast}}</div>
</sc-if>


<!-- ================= AYDINLATMA METNİ ================= -->
<sc-if value="{{isAydinlatma}}" hint-placeholder-val="{{ false }}">
<div>
  <div style="background:oklch(0.21 0.02 55)">
    <div style="max-width:820px;margin:0 auto;padding:44px 34px 38px">
      <div class="kick" style="color:oklch(0.78 0.09 78)">Kişisel verilerin korunması</div>
      <h1 style="font-size:34px;color:oklch(0.965 0.012 78);margin-top:12px;line-height:1.15">Bu platform hangi verinizi işliyor?</h1>
      <div style="font-family:'Newsreader',serif;font-style:italic;font-size:17px;color:oklch(0.8 0.08 78);margin-top:12px">6698 sayılı Kişisel Verilerin Korunması Kanunu kapsamında aydınlatma metni</div>
    </div>
  </div>
  <div style="max-width:820px;margin:0 auto;padding:40px 34px 80px">

    <div style="background:oklch(0.955 0.022 145);border-left:2px solid oklch(0.5 0.09 145);padding:18px 22px;margin-bottom:34px">
      <div style="font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:oklch(0.36 0.07 145)">Kısaca: adınızı istemiyoruz.</div>
      <div class="rd" style="font-size:14.6px;margin-top:8px;color:oklch(0.3 0.03 145)">Sunucuda ad, soyad, e-posta, telefon veya T.C. kimlik numarası tutulmaz. Yalnızca ders kodu, öğrenci numaranız, PIN'inizin geri çevrilemez özeti ve hangi adımları tamamladığınız saklanır.</div>
    </div>

    <sc-for list="{{kvkkBolumler}}" as="k" hint-placeholder-count="8">
      <div style="padding:20px 0;border-bottom:1px solid oklch(0.9 0.011 72)">
        <div class="kick" style="color:oklch(0.52 0.14 42);margin-bottom:9px">{{k.baslik}}</div>
        <div class="rd" style="font-size:15px">{{k.metin}}</div>
        <sc-if value="{{k.liste}}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:12px">
            <sc-for list="{{k.liste}}" as="m" hint-placeholder-count="5">
              <div style="display:flex;gap:12px;align-items:flex-start;padding:6px 0">
                <div style="width:6px;height:6px;flex:none;margin-top:8px;background:oklch(0.74 0.1 78);transform:rotate(45deg)"></div>
                <div class="rd" style="font-size:14.5px">{{m}}</div>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <div style="display:flex;gap:12px;margin-top:34px;flex-wrap:wrap">
      <button onClick="{{goWelcome}}" class="btnp">Giriş ekranına dön</button>
    </div>
  </div>
</div>
</sc-if>

</div>
</script>
